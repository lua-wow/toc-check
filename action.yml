name: WoW Addon TOC Check
description: Check that every file listed in a World of Warcraft addon's TOC and XML exists
author: lua-wow
branding:
  icon: check-square
  color: yellow

inputs:
  path:
    description: Addon root directory
    default: "."

runs:
  using: composite
  steps:
    - name: Check TOC
      shell: bash
      env:
        ADDON_PATH: ${{ inputs.path }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"
